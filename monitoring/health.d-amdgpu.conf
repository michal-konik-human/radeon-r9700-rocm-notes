# /etc/netdata/health.d/amdgpu.conf
#
# Hardware alerts for a discrete AMD GPU compute box.
# Goal: catch a problem BEFORE something is destroyed, not after.
#
# Every rule is a `template:` on a CONTEXT, not an `alarm:` on a specific chart.
# That means additional GPUs inherit these alerts automatically the moment they are
# installed - nothing to add here.
#
# Thresholds read off the card itself (amd-smi static -g 0 -> LIMIT):
#   SLOWDOWN_HOTSPOT 110 C   SHUTDOWN_HOTSPOT 115 C
#   SLOWDOWN_EDGE    110 C   SHUTDOWN_EDGE    115 C
#   SLOWDOWN_VRAM    108 C   SHUTDOWN_VRAM    113 C
# Alert thresholds sit well below those, to leave time to react.
# For reference: under sustained real inference this card reached junction 83 C.
#
# BEWARE OF THIS NETDATA TRAP: a `lookup` WITHOUT `of <dimension>` SUMS all of the
# chart's dimensions. The first version of the NIC rule below had no `of` and reported
# 80 C from two controllers sitting at 39 C each (39+39) - it would have fired for no
# reason, and the number looked entirely plausible. Give every rule an explicit dimension.

# ----------------------------------------------------------------- temperatures

template: amdgpu_hotspot_high
      on: amdgpu.temperature
   class: Errors
    type: System
component: GPU
  lookup: max -1m unaligned of hotspot
   units: Celsius
   every: 10s
    warn: $this > 90
    crit: $this > 100
   delay: down 5m multiplier 1.5 max 1h
    info: GPU junction temperature. Card throttles at 110 C, shuts down at 115 C.
      to: sysadmin

# GDDR6 is the most sensitive part of the card - it degrades PERMANENTLY above 100 C.
# Hence a LOWER threshold than the core, despite a similar firmware limit.
template: amdgpu_memory_temp_high
      on: amdgpu.temperature
   class: Errors
    type: System
component: GPU
  lookup: max -1m unaligned of mem
   units: Celsius
   every: 10s
    warn: $this > 85
    crit: $this > 95
   delay: down 5m multiplier 1.5 max 1h
    info: GDDR6 memory temperature. Above 100 C degradation is PERMANENT - do not wait for the 108 C limit.
      to: sysadmin

template: amdgpu_edge_temp_high
      on: amdgpu.temperature
   class: Errors
    type: System
component: GPU
  lookup: max -1m unaligned of edge
   units: Celsius
   every: 10s
    warn: $this > 85
    crit: $this > 95
   delay: down 5m multiplier 1.5 max 1h
    info: GPU edge temperature.
      to: sysadmin

# ------------------------------------------------- cooling failure (MOST IMPORTANT)

# A stopped fan on a hot card is the clearest "act now" signal there is.
# The metric is derived in amdgpu.plugin, where RPM and junction appear in one sample.
# 0 = fine, 1 = fan stopped while junction >= 70 C.
template: amdgpu_cooling_fault
      on: amdgpu.cooling_fault
   class: Errors
    type: System
component: GPU
  lookup: max -1m unaligned of fault
   units: boolean
   every: 10s
    crit: $this > 0
   delay: down 10m multiplier 1.5 max 1h
    info: COOLING FAILURE - GPU fan stopped on a hot card. Remove the load IMMEDIATELY.
      to: sysadmin

# --------------------------------------------------- memory and bus error counters

# Any uncorrectable error means data corruption. Zero tolerance.
template: amdgpu_ecc_uncorrectable
      on: amdgpu.ecc
   class: Errors
    type: System
component: GPU
  lookup: max -10m unaligned of uncorrectable
   units: errors
   every: 30s
    crit: $this > 0
   delay: down 1h multiplier 1 max 2h
    info: Uncorrectable ECC errors in GPU memory. Any measurement from now on is void.
      to: sysadmin

# Correctable errors growing over time usually precede a memory failure.
template: amdgpu_ecc_correctable_growing
      on: amdgpu.ecc
   class: Errors
    type: System
component: GPU
  lookup: min -10m unaligned of correctable
   units: errors
   every: 60s
    warn: $this > 100
   delay: down 1h multiplier 1 max 2h
    info: Growing correctable ECC errors - often a precursor to memory failure.
      to: sysadmin

template: amdgpu_pcie_aer_fatal
      on: amdgpu.aer
   class: Errors
    type: System
component: GPU
  lookup: max -10m unaligned of fatal
   units: errors
   every: 30s
    crit: $this > 0
   delay: down 1h multiplier 1 max 2h
    info: Fatal PCIe AER errors. Check card seating, riser/M.2 adapter and the 12V connector.
      to: sysadmin

template: amdgpu_pcie_aer_nonfatal
      on: amdgpu.aer
   class: Errors
    type: System
component: GPU
  lookup: max -10m unaligned of nonfatal
   units: errors
   every: 30s
    warn: $this > 0
   delay: down 1h multiplier 1 max 2h
    info: Non-fatal PCIe AER errors - the link recovers, but something is physically wrong.
      to: sysadmin

template: amdgpu_pcie_aer_correctable
      on: amdgpu.aer
   class: Errors
    type: System
component: GPU
  lookup: max -10m unaligned of correctable
   units: errors
   every: 60s
    warn: $this > 1000
   delay: down 1h multiplier 1 max 2h
    info: High correctable PCIe error count - usually marginal card seating or a cable.
      to: sysadmin

# ------------------------------------------------------------ PCIe link width

# Alert only if the link falls BELOW x4. Going x16 -> x8 when a second card is added
# is EXPECTED and must not generate a false alarm.
template: amdgpu_pcie_width_degraded
      on: amdgpu.pcie_width
   class: Errors
    type: System
component: GPU
  lookup: min -5m unaligned of width
   units: lanes
   every: 60s
    warn: $this < 4
    crit: $this < 2
   delay: down 30m multiplier 1 max 1h
    info: PCIe link width below plan. Check card seating and any M.2 adapter.
      to: sysadmin

# NOTE: there is deliberately NO alert on amdgpu.throttled. This card reports
# THROTTLED at idle (16 W, 33 C), so an alert there would be a false-alarm generator.
# The flag is charted for visibility only. Do not add one without verifying the
# firmware behaviour has changed.

# ------------------------------------------------------------------------- host

template: amdgpu_host_cpu_temp_high
      on: amdgpu.cpu_temperature
   class: Errors
    type: System
component: CPU
  lookup: max -1m unaligned of pkg
   units: Celsius
   every: 10s
    warn: $this > 85
    crit: $this > 92
   delay: down 5m multiplier 1.5 max 1h
    info: CPU package temperature.
      to: sysadmin

template: amdgpu_host_nvme_temp_high
      on: amdgpu.nvme_temperature
   class: Errors
    type: System
component: Disk
  lookup: max -1m unaligned of composite
   units: Celsius
   every: 10s
    warn: $this > 70
    crit: $this > 80
   delay: down 5m multiplier 1.5 max 1h
    info: System drive temperature. Above ~80 C the drive starts throttling.
      to: sysadmin

template: amdgpu_host_nvme_critical_warning
      on: amdgpu.nvme_health
   class: Errors
    type: System
component: Disk
  lookup: max -10m unaligned of critical_warning
   units: flag
   every: 60s
    crit: $this > 0
   delay: down 1h multiplier 1 max 2h
    info: Drive set the SMART critical_warning flag. Back up measurement data.
      to: sysadmin

template: amdgpu_host_nvme_media_errors
      on: amdgpu.nvme_health
   class: Errors
    type: System
component: Disk
  lookup: max -10m unaligned of media_errors
   units: errors
   every: 60s
    warn: $this > 0
   delay: down 1h multiplier 1 max 2h
    info: Drive reports media errors.
      to: sysadmin

template: amdgpu_host_nvme_wear_high
      on: amdgpu.nvme_health
   class: Errors
    type: System
component: Disk
  lookup: max -1h unaligned of percentage_used
   units: percent
   every: 5m
    warn: $this > 80
    crit: $this > 90
   delay: down 1h multiplier 1 max 6h
    info: Drive wear per SMART.
      to: sysadmin

# One rule per NIC, with an explicit dimension - see the trap note at the top.
template: amdgpu_host_nic0_temp_high
      on: amdgpu.nic_temperature
   class: Errors
    type: System
component: Network
  lookup: max -5m unaligned of nic0
   units: Celsius
   every: 60s
    warn: $this > 90
    crit: $this > 100
   delay: down 15m multiplier 1.5 max 1h
    info: NIC 0 controller temperature.
      to: sysadmin

template: amdgpu_host_nic1_temp_high
      on: amdgpu.nic_temperature
   class: Errors
    type: System
component: Network
  lookup: max -5m unaligned of nic1
   units: Celsius
   every: 60s
    warn: $this > 90
    crit: $this > 100
   delay: down 15m multiplier 1.5 max 1h
    info: NIC 1 controller temperature.
      to: sysadmin
